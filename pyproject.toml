[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "trex-gym"
version = "0.1.0"
description = "OpenAI Gym environment using pybullet for a Tyrannosaur."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jeffrey T. Bingham", email = "bingjeff@gmail.com" },
]
dependencies = [
    "absl-py",
    "baselines",
    "glfw",
    "gym",
    "joblib",
    "jupyter-rfb",
    "matplotlib",
    "mediapy",
    "mujoco",
    "numpy",
    "pillow",
    "pybullet",
    "pycollada",
    "pygfx",
    "pyglet",
    "scipy",
    "tensorflow",
]

[dependency-groups]
dev = [
    "black",
    "ipython",
    "notebook",
]

[tool.setuptools.packages.find]
include = ["trex_gym*"]

[tool.black]
line-length = 88
target-version = ["py310"]
